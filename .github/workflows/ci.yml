name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR supersedes its run in progress. Runs on main are never cancelled,
# so a deployment is never interrupted part-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore --configuration Release

      # Integration tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - run: npm test -- --watch=false

      - run: npm run build

  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: src/api/RiskyBusiness.Api
          - name: web
            context: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds for x64 and the Pi (arm64) without publishing. The Dockerfiles cross-compile on the
      # runner's native platform, so no emulation is needed.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Only after every check passes on main. Images are tagged with the commit SHA, and that same
  # image is promoted from dev to prod.
  publish:
    name: Publish (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: src/api/RiskyBusiness.Api
          - name: web
            context: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/risky-business-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # Deployments need the self-hosted runner on the Pi. Set the repository variable
  # DEPLOY_ENABLED to "true" once it is installed (docs/runbooks/pi-setup.md).
  deploy-dev:
    name: Deploy dev
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      version: ${{ github.sha }}

  # Waits for approval in GitHub (the prod environment requires a reviewer).
  deploy-prod:
    name: Deploy prod
    needs: deploy-dev
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      version: ${{ github.sha }}
