name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore --configuration Release

      # Integration tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - run: npm test -- --watch=false

      - run: npm run build

  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: src/api/RiskyBusiness.Api
          - name: web
            context: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds for x64 and the Pi (arm64) without publishing. The Dockerfiles cross-compile on the
      # runner's native platform, so no emulation is needed.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
